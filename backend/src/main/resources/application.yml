spring:
  application:
    name: verse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGODB_URI}

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}
  expiration: ${JWT_ACCESS_EXPIRY:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRY:604800000}

# -----------------------------------------------------------------------------
# AI Studio Configuration
# -----------------------------------------------------------------------------
ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${AI_API_KEY}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-4o-mini}
  max-tokens: 1200
  temperature: 0.9
  limits:
    max-daily-generations: 20
    max-poem-length: 2000

# -----------------------------------------------------------------------------
# Payments (Stripe)
# -----------------------------------------------------------------------------
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# -----------------------------------------------------------------------------
# Web & Security Configuration
# -----------------------------------------------------------------------------
app:
  cors:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
